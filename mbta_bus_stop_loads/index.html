            layer_BusStopSegments_highlight.clearLayers();
            layer_BusStopSegments_highlight.addData(busHighlightedFeature);
        }
        function clearBusHighlight(e) {
            if (busHighlightedFeature === e.target.feature) {

        var map = L.map('map', {

        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        var initialViewBounds = L.latLngBounds(
            [42.22, -71.24],
            [42.45, -70.96]
        );
        function setBounds() {
            map.invalidateSize({pan: false});
            map.fitBounds(initialViewBounds, {animate: false});
        }
        if (typeof ResizeObserver !== 'undefined') {
            var mapResizeObserver = new ResizeObserver(function() {

        map.createPane('pane_ESRIGraylight_0');

        function pop_BusStopSegments_1(feature, layer) {
            layer.on({
                mouseover: showBusHighlight,
                mouseout: clearBusHighlight,
            });
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">From</th>\
                        <td class="visible-with-data" id="from_stop_name">' + (feature.properties['from_stop_name'] !== null ? autolinker.link(String(feature.properties['from_stop_name']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">To</th>\
                        <td class="visible-with-data" id="to_stop_name">' + (feature.properties['to_stop_name'] !== null ? autolinker.link(String(feature.properties['to_stop_name']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Bus Routes</th>\
                        <td class="visible-with-data" id="routes_with_3_trips_proxy">' + (feature.properties['routes_with_3_trips_proxy'] !== null ? autolinker.link(String(feature.properties['routes_with_3_trips_proxy']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Frequent Routes</th>\
                        <td class="visible-with-data" id="frequent_routes_70_trips_proxy">' + (feature.properties['frequent_routes_70_trips_proxy'] !== null ? autolinker.link(String(feature.properties['frequent_routes_70_trips_proxy']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row"># Pax Daily</th>\
                        <td class="visible-with-data" id="load_sum">' + (feature.properties['load_sum'] !== null ? autolinker.link(String(feature.properties['load_sum']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function busInnerWeight(feature) {
            const load = Number(feature.properties['load_sum']);
            return Number.isFinite(load) ? (load / 2000) * 3.8 : 1.0;
        }
        function busCasingWeight(feature) {
            return busInnerWeight(feature) + 0.6 * 3.8;
        }
        function busHitWeight(feature) {
            return Math.max(10, busCasingWeight(feature) + 4);
        }
        function busHighlightWeight(feature) {
            return Math.max(6, busCasingWeight(feature) + 2);
        }

            }
        }
        map.createPane('pane_BusStopSegments_1');
        map.getPane('pane_BusStopSegments_1').style.zIndex = 401;
        map.getPane('pane_BusStopSegments_1').style['mix-blend-mode'] = 'normal';
        var layer_BusStopSegments_1 = new L.geoJson.multiStyle(json_BusStopSegments_1, {
            attribution: '',
            interactive: false,
            dataVar: 'json_BusStopSegments_1',
            layerName: 'layer_BusStopSegments_1',
            pane: 'pane_BusStopSegments_1',
            styles: [style_BusStopSegments_1_0,style_BusStopSegments_1_1,]
        });
        bounds_group.addLayer(layer_BusStopSegments_1);
        map.addLayer(layer_BusStopSegments_1);

        // Keep interaction geometry separate from the two visible QGIS-derived strokes.
        // This avoids multi-style hover/reset conflicts and makes thin lines easier to target.
        map.createPane('pane_BusStopSegments_hit');
        map.getPane('pane_BusStopSegments_hit').style.zIndex = 402;
        map.getPane('pane_BusStopSegments_hit').style['mix-blend-mode'] = 'normal';
        var layer_BusStopSegments_hit = L.geoJSON(json_BusStopSegments_1, {
            attribution: '',
            interactive: true,
            pane: 'pane_BusStopSegments_hit',
            style: function(feature) {
                return {
                    pane: 'pane_BusStopSegments_hit',
                    color: '#000000',
                    opacity: 0,
                    weight: busHitWeight(feature),
                    lineCap: 'round',
                    lineJoin: 'round',
                    fillOpacity: 0,
                    interactive: true,
                };
            },
            onEachFeature: pop_BusStopSegments_1,
        }).addTo(map);

        // Draw hover feedback in its own noninteractive layer so it cannot steal
        // pointer events or become stranded by multi-style resetStyle behavior.
        map.createPane('pane_BusStopSegments_highlight');
        map.getPane('pane_BusStopSegments_highlight').style.zIndex = 403;
        map.getPane('pane_BusStopSegments_highlight').style.pointerEvents = 'none';
        layer_BusStopSegments_highlight = L.geoJSON(null, {
            pane: 'pane_BusStopSegments_highlight',
            interactive: false,
            style: function(feature) {
                return {
                    pane: 'pane_BusStopSegments_highlight',
                    color: '#ffff00',
                    opacity: 0.85,
                    weight: busHighlightWeight(feature),
                    lineCap: 'round',
                    lineJoin: 'round',
                    fillOpacity: 0,
                    interactive: false,

            },

        setBounds();
