        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var bufferModeAllAreasButton;
        var bufferModeOutsideWalkButton;
        var mapHeaderControl = new L.Control({'position':'topleft'});
        mapHeaderControl.onAdd = function (map) {
            var container = L.DomUtil.create('div', 'map-header-control');

            var titlePanel = L.DomUtil.create('div', 'info map-title-panel', container);
            titlePanel.innerHTML = '<h2>Neighborhoods with density that support heavy rail</h2>';

            var modeControl = L.DomUtil.create('div', 'buffer-mode-control', container);
            modeControl.setAttribute('role', 'group');
            modeControl.setAttribute('aria-label', 'Map area focus');

            bufferModeAllAreasButton = L.DomUtil.create('button', 'buffer-mode-option buffer-mode-option-active', modeControl);
            bufferModeAllAreasButton.type = 'button';
            bufferModeAllAreasButton.textContent = 'All areas';
            bufferModeAllAreasButton.setAttribute('aria-pressed', 'true');

            bufferModeOutsideWalkButton = L.DomUtil.create('button', 'buffer-mode-option', modeControl);
            bufferModeOutsideWalkButton.type = 'button';

            L.DomEvent.disableClickPropagation(titlePanel);

        var abstractText = 'This map shows population density in Greater Boston from the 2020 Census. Each Census block is colored by nearby population density within a 1/4 mile circle around the block.<br /><br />Following the literature review in <i>Transit-Supportive Density in Greater Boston</i> (Boston Indicators and TransitMatters, 2025), we use <b>40 people per acre</b> as a benchmark for frequent, reliable service, such as subways and high-frequency regional rail. We use <b>15 people per acre</b> as a benchmark for moderate-frequency service, such as buses or trains every 30 minutes or better. Areas within 1/2 mile of Red, Orange and Blue Line stations have a median density of <b>27.3 people per acre</b>.<br /><br />Dashed regions are buffers around Census blocks whose density within 1/2 mile meets the high-frequency benchmark, so they show the extents of the "neighborhoods" whose residents contribute to such transit-supportive density.';
        var abstract = new L.Control({'position':'topleft'});
        abstract.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'leaflet-control leaflet-bar abstract-control');
            this._div.id = 'abstract';

            this._button = L.DomUtil.create('a', 'abstract-button', this._div);
            this._button.href = '#';
            this._button.setAttribute('role', 'button');
            this._button.setAttribute('aria-label', 'About this map');
            this._button.setAttribute('aria-expanded', 'false');
            this._button.textContent = 'i';

            this._panel = L.DomUtil.create('div', 'abstractUncollapsed', this._div);
            this._panel.innerHTML = abstractText;
            this._panel.hidden = true;
            this._panel.setAttribute('role', 'button');
            this._panel.setAttribute('tabindex', '0');
            this._panel.setAttribute('aria-label', 'Close map information');

            L.DomEvent.disableClickPropagation(this._div);
            L.DomEvent.disableScrollPropagation(this._div);
            L.DomEvent.on(this._button, 'click', function(e) {
                L.DomEvent.preventDefault(e);
                abstract.show();
            });
            L.DomEvent.on(this._button, 'keydown', function(e) {
                if (e.key === ' ') {
                    L.DomEvent.preventDefault(e);
                    abstract.show();
                }
            });
            L.DomEvent.on(this._panel, 'click', function(e) {
                L.DomEvent.preventDefault(e);
                abstract.hide();
            });
            L.DomEvent.on(this._panel, 'keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    L.DomEvent.preventDefault(e);
                    abstract.hide();
                }
            });
            this.hide();
            return this._div;
        };
        abstract.hide = function () {
            this._div.classList.remove('abstract-expanded');
            this._div.classList.add('leaflet-bar');
            this._button.hidden = false;
            this._panel.hidden = true;
            this._button.setAttribute('aria-expanded', 'false');
        };
        abstract.show = function () {
            this._div.classList.remove('leaflet-bar');
            this._div.classList.add('abstract-expanded');
            this._button.hidden = true;
            this._panel.hidden = false;
            this._button.setAttribute('aria-expanded', 'true');

        function pop_WebexportdatasetPopulationdensitywithin14mi_1(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td class="visible-with-data" id="pax_per_acre_in_0p25mi_round_2_dec_place" colspan="2"><strong>Density in 1/4 mi (pax/acre)</strong><br />' + (feature.properties['pax_per_acre_in_0p25mi_round_2_dec_place'] !== null ? autolinker.link(String(feature.properties['pax_per_acre_in_0p25mi_round_2_dec_place']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td class="visible-with-data" id="pax_per_acre_in_0p5mi_round_2_dec_place" colspan="2"><strong>Density in 1/2 mi (pax/acre)</strong><br />' + (feature.properties['pax_per_acre_in_0p5mi_round_2_dec_place'] !== null ? autolinker.link(String(feature.properties['pax_per_acre_in_0p5mi_round_2_dec_place']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_WebexportdatasetPopulationdensitywithin14mi_1_0(feature) {
            var density =
                Number(feature.properties['population_0p25mi']) /
                (Math.PI * Math.pow(5280 / 4, 2)) * 43560;
            var fillColor = 'rgba(215,48,39,1.0)';
            if (density <= 15) {
                fillColor = 'rgba(237,237,237,1.0)';
            } else if (density <= 27.33488) {
                fillColor = 'rgba(217,239,139,1.0)';
            } else if (density <= 40) {
                fillColor = 'rgba(253,174,97,1.0)';
            }
            return {
                pane: 'pane_WebexportdatasetPopulationdensitywithin14mi_1',
                opacity: 1,
                color: 'rgba(147,147,147,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 0.18897637795275593,
                fill: true,
                fillOpacity: 1,
                fillColor: fillColor,
                interactive: true,
            };
        }
        map.createPane('pane_WebexportdatasetPopulationdensitywithin14mi_1');

        function updateBufferModeState() {
            var outsideMode = map.hasLayer(layer_Rapidtransitstationsbuffered_3);
            bufferModeAllAreasButton.classList.toggle('buffer-mode-option-active', !outsideMode);
            bufferModeOutsideWalkButton.classList.toggle('buffer-mode-option-active', outsideMode);
            bufferModeAllAreasButton.setAttribute('aria-pressed', String(!outsideMode));
            bufferModeOutsideWalkButton.setAttribute('aria-pressed', String(outsideMode));
        }
        L.DomEvent.on(bufferModeAllAreasButton, 'click', function(e) {
            L.DomEvent.preventDefault(e);
            if (map.hasLayer(layer_Rapidtransitstationsbuffered_3)) {
                map.removeLayer(layer_Rapidtransitstationsbuffered_3);
            }
            updateBufferModeState();
        });
        L.DomEvent.on(bufferModeOutsideWalkButton, 'click', function(e) {
            L.DomEvent.preventDefault(e);
            if (!map.hasLayer(layer_Rapidtransitstationsbuffered_3)) {
                map.addLayer(layer_Rapidtransitstationsbuffered_3);
            }
            updateBufferModeState();
        });
        map.on('layeradd layerremove', function(e) {
            if (e.layer === layer_Rapidtransitstationsbuffered_3) {
                updateBufferModeState();
            }
        });
        updateBufferModeState();

        var densityLegend = L.control({position: 'bottomleft'});
        densityLegend.onAdd = function(map) {
            var div = L.DomUtil.create('div', 'leaflet-control map-density-legend');
            var toggleButton = L.DomUtil.create('button', 'map-density-legend-toggle', div);
            toggleButton.type = 'button';
            var toggleLabel = L.DomUtil.create('span', 'map-density-legend-toggle-label', toggleButton);
            var toggleIndicator = L.DomUtil.create('span', 'map-density-legend-toggle-indicator', toggleButton);
            toggleIndicator.setAttribute('aria-hidden', 'true');

            var body = L.DomUtil.create('div', 'map-density-legend-body', div);
            body.innerHTML =
                '<div class="map-density-legend-row"><span class="map-density-legend-swatch" style="background:#ededed"></span><span>0–15</span></div>' +
                '<div class="map-density-legend-row"><span class="map-density-legend-swatch" style="background:#d9ef8b"></span><span>15–27.3</span></div>' +
                '<div class="map-density-legend-row"><span class="map-density-legend-swatch" style="background:#fdae61"></span><span>27.3–40</span></div>' +
                '<div class="map-density-legend-row"><span class="map-density-legend-swatch" style="background:#d73027"></span><span>40+</span></div>' +
                '<div class="map-density-legend-separator"></div>' +
                '<div class="map-density-legend-row map-density-legend-region-row"><span class="map-density-legend-region-symbol"><span></span></span><span>Regions with transit-supportive density</span></div>';

            function setLegendExpanded(expanded) {
                div.classList.toggle('map-density-legend-collapsed', !expanded);
                body.hidden = !expanded;
                toggleButton.setAttribute('aria-expanded', String(expanded));
                toggleLabel.textContent = expanded ? 'Density within 1/4 mi (pax/acre)' : 'Legend';
                toggleIndicator.textContent = expanded ? '▾' : '▸';
            }

            var legendUserHasChosenState = false;
            function syncLegendToMapWidth() {
                if (legendUserHasChosenState) {
                    return;
                }
                var mapWidth = map.getContainer().clientWidth;
                if (mapWidth > 0) {
                    setLegendExpanded(mapWidth > 700);
                }
            }

            setLegendExpanded(false);
            syncLegendToMapWidth();
            if (typeof ResizeObserver !== 'undefined') {
                div._legendResizeObserver = new ResizeObserver(syncLegendToMapWidth);
                div._legendResizeObserver.observe(map.getContainer());
            } else {
                map.on('resize', syncLegendToMapWidth);
            }
            L.DomEvent.on(toggleButton, 'click', function(e) {
                L.DomEvent.preventDefault(e);
                legendUserHasChosenState = true;
                setLegendExpanded(toggleButton.getAttribute('aria-expanded') !== 'true');
            });
            L.DomEvent.disableClickPropagation(div);
            L.DomEvent.disableScrollPropagation(div);
            return div;
        };
        densityLegend.addTo(map);
        function pop_Labels_3(feature, layer) {
            var rawPriority = feature.properties['is_priority'];
            var isPriority = rawPriority === true || rawPriority === 1 ||
                String(rawPriority).toLowerCase() === 'true' || String(rawPriority) === '1';
            var labelClass = isPriority ? 'qgis-map-label qgis-map-label-priority' :
                'qgis-map-label qgis-map-label-other';
            layer.bindTooltip(String(feature.properties['name'] || ''), {
                permanent: true,
                direction: 'center',
                className: labelClass,
                interactive: false,
                opacity: 1
            });
        }

                return L.circleMarker(latlng, style_Labels_3_0(feature));

        bounds_group.addLayer(layer_Labels_3);
        map.addLayer(layer_Labels_3);
        function refreshLabels_3Collisions() {
            labelEngine.reset();
            var mapRect = map.getContainer().getBoundingClientRect();
            var labelId = 0;
            layer_Labels_3.eachLayer(function(labelLayer) {
                var tooltip = labelLayer.getTooltip && labelLayer.getTooltip();
                if (!tooltip || !tooltip._container) {
                    return;
                }
                var label = tooltip._container;
                label.style.opacity = 1;
                var rect = label.getBoundingClientRect();
                if (!rect.width || !rect.height) {
                    return;
                }
                var bottomLeft = map.containerPointToLatLng([
                    rect.left - mapRect.left,
                    rect.bottom - mapRect.top
                ]);
                var topRight = map.containerPointToLatLng([
                    rect.right - mapRect.left,

                ]);
                labelEngine.ingestLabel({

                    topRight: [topRight.lng, topRight.lat]
                }, ++labelId, 5, label, 'Labels_3_' + labelId, false);
            });

        // Developer-only layer switches for preparing screenshots/static images.
        // The switches live inside the existing information panel, so closing the
        // panel hides the controls without changing which layers are visible.
        function installDeveloperLayerControls() {
            var controls = L.DomUtil.create('div', 'developer-layer-controls', abstract._panel);
            controls.setAttribute('role', 'group');
            controls.setAttribute('aria-label', 'Developer display options');

            var heading = L.DomUtil.create('div', 'developer-layer-controls-title', controls);
            heading.textContent = 'Developer display options';

            function addLayerCheckbox(labelText, layer, onShown) {
                var label = L.DomUtil.create('label', 'developer-layer-control-row', controls);
                var checkbox = L.DomUtil.create('input', '', label);
                checkbox.type = 'checkbox';
                checkbox.checked = map.hasLayer(layer);

                var text = L.DomUtil.create('span', '', label);
                text.textContent = labelText;

                L.DomEvent.on(checkbox, 'change', function() {
                    if (checkbox.checked) {
                        if (!map.hasLayer(layer)) {
                            map.addLayer(layer);
                        }
                        if (onShown) {
                            onShown();
                        }
                    } else if (map.hasLayer(layer)) {
                        map.removeLayer(layer);
                    }
                });

                map.on('layeradd layerremove', function(e) {
                    if (e.layer === layer) {
                        checkbox.checked = map.hasLayer(layer);
                    }
                });
                return checkbox;
            }

            addLayerCheckbox('Neighborhood names', layer_Labels_3, scheduleLabels_3CollisionRefresh);
            addLayerCheckbox('Dotted buffer regions', layer_Regionswithtransitsupportivedensity_2);

            var note = L.DomUtil.create('div', 'developer-layer-controls-note', controls);
            note.textContent = 'Close the information panel to hide these controls; the selected layers stay visible or hidden.';

            // Keep interactions with the developer controls inside the open
            // information panel. Leaflet's disableClickPropagation() protects the
            // map, but the panel itself has its own click-to-close handler, so stop
            // ordinary click events here without preventing the checkbox default.
            L.DomEvent.disableClickPropagation(controls);
            L.DomEvent.disableScrollPropagation(controls);
            L.DomEvent.on(controls, 'click', function(e) {
                L.DomEvent.stopPropagation(e);
            });
            L.DomEvent.on(controls, 'keydown', function(e) {
                L.DomEvent.stopPropagation(e);
            });
        }
        installDeveloperLayerControls();
